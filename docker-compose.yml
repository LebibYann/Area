version: '3.8'

services:
  db:
    image: mysql:latest
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql

  server:
    build: ./server
    ports:
      - "8080:8080"
    depends_on:
      - db

  client_mobile:
    build: ./mobile
    volumes:
      - shared-volume:/usr/src/app/shared

  client_web:
    build: ./web
    ports:
      - "8081:8081"
    volumes:
      - shared-volume:/usr/src/app/shared
    depends_on:
      - server
      - client_mobile
    


volumes:
  shared-volume:
  mysql-data:
